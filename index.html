    <script>
      (function() {
        // In AI Studio Build preview environment, HMR is disabled and proxies do not route raw WebSocket connections.
        // Intercept Vite HMR/ping WebSocket connections and provide a silent mock transport to prevent "WebSocket closed without opened" errors.
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OriginalWebSocket = window.WebSocket;
          function ViteSafeWebSocket(url, protocols) {
            var isViteHmr = 
              (typeof protocols === 'string' && (protocols === 'vite-hmr' || protocols === 'vite-ping')) ||
              (Array.isArray(protocols) && (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1)) ||
              (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('vite') !== -1));

            if (isViteHmr) {
              var listeners = { open: [], message: [], close: [], error: [] };
              var dummySocket = {
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                readyState: 1,
                protocol: typeof protocols === 'string' ? protocols : 'vite-hmr',
                url: String(url),
                send: function() {},
                close: function() {},
                addEventListener: function(event, fn) {
                  if (listeners[event]) listeners[event].push(fn);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { fn({ type: 'open', target: dummySocket }); } catch(_) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, fn) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(cb) { return cb !== fn; });
                  }
                },
                dispatchEvent: function() { return true; }
              };
              return dummySocket;
            }

            return new OriginalWebSocket(url, protocols);
          }
          ViteSafeWebSocket.prototype = OriginalWebSocket.prototype;
          ViteSafeWebSocket.CONNECTING = 0;
          ViteSafeWebSocket.OPEN = 1;
          ViteSafeWebSocket.CLOSING = 2;
          ViteSafeWebSocket.CLOSED = 3;
          window.WebSocket = ViteSafeWebSocket;
        }

        // Catch any unhandled rejection or error mentioning WebSocket
        window.addEventListener('unhandledrejection', function (e) {
          if (e.reason && (String(e.reason).indexOf('WebSocket') !== -1 || (e.reason.message && String(e.reason.message).indexOf('WebSocket') !== -1))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function (e) {
          if (e.message && e.message.indexOf('WebSocket') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
      })();
    </script>
